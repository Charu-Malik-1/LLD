#while runing local
#spring.datasource.url=jdbc:sqlserver://localhost:57822;databaseName=BookingDB;encrypt=true;trustServerCertificate=true

#while running in docker
spring.datasource.url=jdbc:sqlserver://host.docker.internal:57822;databaseName=BookingDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=bookinguser
spring.datasource.password=Booking@123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379


# ===============================
# Actuator
# ===============================

management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Prometheus endpoint
management.endpoint.prometheus.access=unrestricted

# Add application name as a common metric tag
management.metrics.tags.application=my-spring-app